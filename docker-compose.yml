services:
  n8n:
    image: n8nio/n8n
    container_name: stock_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - WEBHOOK_URL=https://validity-pencil-accessed-subscription.trycloudflare.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: